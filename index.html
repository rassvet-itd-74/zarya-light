<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./src/assets/favicon.ico" />
    <title>Zarya</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p.lede {
        margin: 0 0 1.5rem;
        opacity: 0.7;
        font-size: 0.875rem;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.4rem 1.25rem;
        margin: 0 0 1.5rem;
        font-size: 0.875rem;
      }
      dt {
        opacity: 0.7;
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        word-break: break-all;
      }
      #worker-health {
        font-weight: 600;
      }
      #worker-health[data-health='HEALTHY'] {
        color: #1a7f37;
      }
      #worker-health[data-health='DEGRADED'],
      #worker-health[data-health='STARTING'] {
        color: #9a6700;
      }
      #worker-health[data-health='STOPPED'] {
        color: #cf222e;
      }
      button {
        font: inherit;
        padding: 0.35rem 0.9rem;
      }
      #network {
        margin: 0 0 1.5rem;
        padding: 0.5rem 0.75rem;
        border-left: 3px solid;
        font-size: 0.875rem;
      }
      #network[data-severity='ok'] {
        border-color: #1a7f37;
      }
      #network[data-severity='pending'] {
        border-color: #9a6700;
      }
      #network[data-severity='blocked'] {
        border-color: #cf222e;
      }
    </style>
  </head>
  <body>
    <h1>Zarya</h1>
    <p class="lede">
      Worker: <span id="worker-health">…</span>
    </p>
    <p id="network" data-severity="pending">Checking the network…</p>
    <dl id="status"></dl>
    <button id="refresh" type="button">Refresh</button>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
