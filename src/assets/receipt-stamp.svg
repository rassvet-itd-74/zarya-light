<!--
  Placeholder receipt stamp. Hard blue lines, no fills, no gradients, no text.

  Everything here is a <path>, because pdf-lib draws SVG through `drawSvgPath`,
  which understands path data and nothing else — no <rect>, no <circle>, no
  <text>. Keeping the asset to paths means the file on disk is the file that
  gets drawn, rather than a source that needs converting by hand.

  The coordinate system is 340 x 170 points with y pointing down, matching what
  `drawSvgPath` expects, so the numbers here are the numbers on the page. The
  geometry is deliberately ruled: every fact drawn into this stamp sits in a
  band bounded by two of these lines, so the mark and the text share one set of
  coordinates instead of drifting apart.

  Width is set by the transaction hash. 66 characters at 8pt in PT Sans is the
  widest thing this stamp will ever hold, and it gets a full-width band of its
  own rather than sharing a row with a label.

  This is a dummy. It exists to be printed and looked at.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="170" viewBox="0 0 340 170">

  <!-- outer rule -->
  <path d="M 1.2 1.2 H 338.8 V 168.8 H 1.2 Z" fill="none" stroke="#12377E" stroke-width="2.4"/>

  <!-- inner rule -->
  <path d="M 7 7 H 333 V 163 H 7 Z" fill="none" stroke="#12377E" stroke-width="1"/>

  <!-- corner ticks -->
  <path d="M 14 26 V 14 H 26" fill="none" stroke="#12377E" stroke-width="1.6"/>
  <path d="M 314 14 H 326 V 26" fill="none" stroke="#12377E" stroke-width="1.6"/>
  <path d="M 326 144 V 156 H 314" fill="none" stroke="#12377E" stroke-width="1.6"/>
  <path d="M 26 156 H 14 V 144" fill="none" stroke="#12377E" stroke-width="1.6"/>

  <!-- star, in the title band -->
  <path d="M 22 9 L 24.7 16.28 L 32.46 16.6 L 26.37 21.42 L 28.47 28.9 L 22 24.6 L 15.53 28.9 L 17.63 21.42 L 11.54 16.6 L 19.3 16.28 Z"
        fill="none" stroke="#12377E" stroke-width="1.2"/>

  <!-- band rules: title / hash / paired rows / paired rows / signer / footer -->
  <path d="M 7 34 H 333" fill="none" stroke="#12377E" stroke-width="1.4"/>
  <path d="M 7 70 H 333" fill="none" stroke="#12377E" stroke-width="0.7"/>
  <path d="M 7 94 H 333" fill="none" stroke="#12377E" stroke-width="0.7"/>
  <path d="M 7 118 H 333" fill="none" stroke="#12377E" stroke-width="0.7"/>
  <path d="M 7 142 H 333" fill="none" stroke="#12377E" stroke-width="1.4"/>

  <!-- column split, through the two paired bands only -->
  <path d="M 176 70 V 118" fill="none" stroke="#12377E" stroke-width="0.7"/>

</svg>
